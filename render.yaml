services:
  - type: web
    name: coderspoint
    env: docker
    plan: free
    rootDir: CodersPoint-main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
