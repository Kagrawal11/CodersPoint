services:
  - type: web
    name: coderspoint
    env: node
    plan: free
    rootDir: CodersPoint-main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: JUDGE0_API_URL
        value: ""
      - key: JUDGE0_AUTH_TOKEN
        sync: false
